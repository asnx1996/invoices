<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>تغيير رمز حساب</title>
<style>
  :root { --bg: #0b1020; --card: #141b2e; --line: #26304a; --text: #e8ecf6; --muted: #8e99b3; --accent: #5b8cff; --bad: #ff6b6b; --ok: #3ecf8e }
  * { box-sizing: border-box }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "Segoe UI", Tahoma, sans-serif; padding: 22px }
  h1 { margin: 0 0 4px; font-size: 19px } p.sub { margin: 0 0 16px; color: var(--muted); font-size: 13.5px }
  label { display: block; margin: 12px 0 6px; color: var(--muted); font-size: 13.5px }
  select, input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #0f1527; color: var(--text); font: inherit }
  select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px }
  button { width: 100%; margin-top: 18px; padding: 11px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer }
  button:disabled { opacity: .6 }
  .msg { margin-top: 14px; padding: 9px 12px; border-radius: 10px; font-size: 14px }
  .bad { background: #ff6b6b1a; color: var(--bad); border: 1px solid #ff6b6b55 }
  .ok { background: #3ecf8e1a; color: var(--ok); border: 1px solid #3ecf8e55 }
  .hidden { display: none }
</style>
</head>
<body>
  <h1>تغيير رمز حساب</h1>
  <p class="sub">من الحاسبة الرئيسية بس — ما يحتاج الرمز القديم. الحساب يطلع من كل الأجهزة ويدخل بالرمز الجديد.</p>
  <label for="acc">الحساب</label>
  <select id="acc"></select>
  <label for="p1">الرمز الجديد (8 أحرف أو أكثر)</label>
  <input id="p1" type="password" dir="ltr" autocomplete="new-password">
  <label for="p2">أعد كتابة الرمز</label>
  <input id="p2" type="password" dir="ltr" autocomplete="new-password">
  <button id="go">تغيير الرمز</button>
  <div id="msg" class="msg hidden"></div>
<script>
  const $ = s => document.querySelector(s);
  const say = (t, cls) => { $('#msg').textContent = t; $('#msg').className = 'msg ' + cls };
  const clean = e => String(e && e.message || e).replace(/^Error invoking remote method '[^']+': (Error: )?/, '');
  window.accounts.list().then(list => {
    if (!list.length) { $('#acc').innerHTML = '<option value="">ماكو حسابات</option>'; $('#go').disabled = true; return }
    $('#acc').innerHTML = list.map(a => `<option value="${a.login}">${a.full_name || a.login} — ${a.login}${a.admin ? ' (أدمن)' : ''}${a.active ? '' : ' (موقوف)'}</option>`).join('');
  }).catch(e => say(clean(e), 'bad'));
  $('#go').onclick = async () => {
    const p = $('#p1').value;
    if (p.length < 8) return say('الرمز لازم 8 أحرف على الأقل', 'bad');
    if (p !== $('#p2').value) return say('الرمزين مو متطابقين', 'bad');
    $('#go').disabled = true;
    try { await window.accounts.reset($('#acc').value, p); say('✓ تغيّر الرمز', 'ok'); $('#p1').value = $('#p2').value = '' }
    catch (e) { say(clean(e), 'bad') }
    $('#go').disabled = false;
  };
</script>
</body>
</html>
