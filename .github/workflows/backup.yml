# نسخة احتياطية أسبوعية كاملة (قاعدة البيانات + ملفات PDF) — مشفّرة
# الإعداد: docs/BACKUP.md
name: Weekly backup

on:
  schedule:
    - cron: '0 0 * * 5'   # كل جمعة الساعة 3 الصبح بتوقيت بغداد
  workflow_dispatch:        # زر "Run workflow" للتشغيل اليدوي

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PASS: ${{ secrets.BACKUP_PASSPHRASE }}
      SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_URL: https://ripxxnmaadnpxocixbva.supabase.co
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then
            echo "::error::ضيف SUPABASE_DB_URL و BACKUP_PASSPHRASE بـ Settings → Secrets → Actions (شوف docs/BACKUP.md)"
            exit 1
          fi

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump database
        run: |
          mkdir -p backup
          pg_dump "$DB_URL" --no-owner --no-privileges --schema=public -f backup/public.sql
          pg_dump "$DB_URL" --data-only --table=auth.users --table=auth.identities -f backup/auth_users.sql
          pg_dump "$DB_URL" --data-only --table=storage.buckets --table=storage.objects -f backup/storage_meta.sql
          ls -la backup

      - name: Download PDF files
        if: env.SERVICE_KEY != ''
        run: node .github/scripts/backup-storage.mjs backup/files

      - name: Encrypt
        run: |
          NAME="invoices-backup-$(date +%F)"
          tar czf - backup | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$PASS" -o "$NAME.tar.gz.gpg"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          rm -rf backup

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz.gpg
          retention-days: 90
