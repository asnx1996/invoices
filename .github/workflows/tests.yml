# يشغّل اختبارات الصلاحيات وقواعد الشغل مع كل تعديل
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: JS syntax
        run: for f in assets/js/*.js sw.js; do node --check "$f"; done
      - name: Database tests (PGlite)
        run: npm test
